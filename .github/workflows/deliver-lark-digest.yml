name: Deliver Chinese Digest to Lark

on:
  schedule:
    - cron: '0 8 * * *'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate generation and lark-cli request without sending'
        required: false
        default: false
        type: boolean

concurrency:
  group: follow-builders-delivery-state
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      OPENAI_MODEL: ${{ vars.FOLLOW_BUILDERS_OPENAI_MODEL || 'gpt-5-mini' }}
      LARK_BRAND: ${{ vars.LARK_BRAND || 'feishu' }}
      FOLLOW_BUILDERS_FEED_SOURCE: local
      FOLLOW_BUILDERS_PROMPT_SOURCE: local

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        working-directory: scripts
        run: npm ci

      - name: Install official lark-cli
        run: npm install --global @larksuite/cli@1.0.86

      - name: Prepare only content not delivered to Lark before
        run: |
          node scripts/queue-lark-content.js --mode all
          node scripts/prepare-digest.js > lark-prepared.json
          node scripts/prepare-lark-run.js \
            --input lark-prepared.json \
            --state state-lark.json \
            --output lark-input.json \
            --next-state state-lark.next.json

      - name: Generate complete Chinese digest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/generate-lark-digest.js --input lark-input.json --output lark-digest.md

      - name: Deliver through lark-cli
        env:
          DELIVERY_METHOD: lark
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_CHAT_ID: ${{ secrets.LARK_CHAT_ID }}
          LARK_OPEN_ID: ${{ secrets.LARK_OPEN_ID }}
          LARK_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node scripts/deliver.js --file lark-digest.md

      - name: Save Lark delivery state
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          mv state-lark.next.json state-lark.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state-lark.json
          git diff --cached --quiet || git commit -m "chore: update Lark delivery state [skip ci]"
          git push
